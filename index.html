<style>
:root{
  --bg:#fbfbfd; --bg2:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --accent:var(--pa-l,#0f6b6b); --accent-ink:#ffffff; --shadow:0 4px 24px rgba(0,0,0,.06); --field:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000000; --bg2:#111113; --card:#1c1c1e; --text:#f5f5f7; --muted:#a1a1a6; --line:#38383a;
  --accent:var(--pa-d,#3fb8b0); --accent-ink:#00201f; --shadow:0 4px 24px rgba(0,0,0,.5); --field:#2c2c2e;}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.47}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1080px;margin:auto;padding:0 22px;height:48px;display:flex;align-items:center;justify-content:space-between;font-size:14px}
.brand{font-weight:600;letter-spacing:-.01em}
.nav-in a.back{color:var(--accent)}
.wrap{max-width:1080px;margin:auto;padding:0 22px}
.hidden{display:none!important}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* HOME */
.hero{text-align:center;padding:88px 0 56px}
.hero h1{font-size:clamp(40px,8vw,72px);line-height:1.05;letter-spacing:-.03em;font-weight:700}
.hero p{font-size:clamp(18px,3vw,24px);color:var(--muted);margin-top:16px;max-width:640px;margin-inline:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding-bottom:96px}
.tile{background:var(--card);border-radius:24px;padding:32px 28px 0;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:400px;transition:transform .3s ease}
.tile:hover{transform:scale(1.015)}
.tile .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile h2{font-size:28px;letter-spacing:-.02em;margin-top:6px}
.tile p{color:var(--muted);margin-top:8px;font-size:16px}
.tile .more{color:var(--accent);margin-top:12px;font-size:16px}
.tile .art{margin-top:auto;padding-top:24px;display:flex;justify-content:center}
.win{width:100%;max-width:300px;border-radius:14px 14px 0 0;background:#f6f1e9;color:#23302f;box-shadow:0 -2px 30px rgba(0,0,0,.15);overflow:hidden;font-size:11px}
.win .bar{height:20px;background:#ebe4d8;display:flex;gap:5px;align-items:center;padding:0 9px}
.win .bar i{width:7px;height:7px;border-radius:50%;background:#c9bfae}
.win .body{padding:12px}
.win .kpi{display:flex;gap:8px}
.win .kpi div{flex:1;background:#fff;border-radius:9px;padding:8px}
.win .kpi b{display:block;font-size:15px;color:#0f6b6b}
.win .kpi span{opacity:.65}
.win .bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:10px;background:#fff;border-radius:9px;padding:8px}
.win .bars i{flex:1;background:#0f6b6b;border-radius:3px 3px 0 0}

/* DETAIL */
.p-hero{text-align:center;padding:72px 0 64px;background:linear-gradient(var(--bg),var(--bg2))}
.p-hero .eyebrow{color:var(--accent);font-weight:600;font-size:19px}
.p-hero h1{font-size:clamp(44px,9vw,88px);letter-spacing:-.035em;line-height:1.03;margin-top:6px}
.p-hero .tag{font-size:clamp(19px,3.4vw,28px);color:var(--muted);max-width:700px;margin:16px auto 0}
.cta{display:flex;gap:14px;justify-content:center;align-items:center;margin:28px 0 48px;flex-wrap:wrap}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:12px 26px;border-radius:99px;font-size:17px;font-weight:500}
.btn:hover{filter:brightness(1.08)}
.link{color:var(--accent);font-size:17px}
.demo-cap{margin-top:16px;font-size:14px;color:var(--muted)}
.sec{padding:96px 0}
.sec.alt{background:var(--bg2)}
.sec h2{font-size:clamp(30px,5.5vw,52px);letter-spacing:-.025em;line-height:1.08;text-align:center}
.sec .lead{color:var(--muted);text-align:center;font-size:clamp(17px,2.6vw,21px);max-width:660px;margin:14px auto 0}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:52px}
.feat>div{background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow);transition:transform .25s ease;text-align:left}
.feat>div.go{cursor:pointer}
.feat>div.go:hover{transform:translateY(-4px)}
.feat .ic{font-size:30px;margin-bottom:10px}
.feat h3{font-size:21px;letter-spacing:-.01em}
.feat p{color:var(--muted);margin-top:6px;font-size:16px}
.feat .try{display:inline-block;margin-top:10px;color:var(--accent);font-size:15px}
.specs{max-width:680px;margin:44px auto 0}
.specs div{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px}
.specs span:first-child{color:var(--muted)}
.specs span:last-child{text-align:right}
.ver{max-width:720px;margin:44px auto 0;display:flex;flex-direction:column;gap:14px}
.v{background:var(--card);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.v h3{font-size:20px}
.v small{color:var(--muted);font-size:14px}
.v ul{margin:8px 0 0 18px;color:var(--muted);font-size:15px}
.v .dl{color:var(--accent);font-weight:500;white-space:nowrap}
.pill{font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.note{max-width:720px;margin:22px auto 0;font-size:13px;color:var(--muted);text-align:center}

/* COMMENTI */
.cm{max-width:720px;margin:44px auto 0}
.cm form{background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow);display:grid;gap:14px}
.cm label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
.cm input[type=text],.cm textarea,.cm select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
.cm input:focus,.cm textarea:focus,.cm select:focus{border-color:var(--accent)}
.cm textarea{min-height:110px;resize:vertical}
.cm .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.cm .two{grid-template-columns:1fr}}
.stars{display:flex;gap:4px;font-size:30px;line-height:1}
.stars button{color:var(--line);transition:color .15s,transform .15s;padding:0}
.stars button.on{color:#f5a623}
.stars button:hover{transform:scale(1.15)}
.cm .send{justify-self:start;background:var(--accent);color:var(--accent-ink);padding:12px 26px;border-radius:99px;font-size:17px;font-weight:500}
.cm .send:disabled{opacity:.45;cursor:default}
.cm-list{margin-top:26px;display:grid;gap:12px}
.cmt{background:var(--card);border-radius:20px;padding:18px 22px;box-shadow:var(--shadow);animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.cmt .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.cmt .h b{color:var(--text);font-size:16px}
.cmt .tg{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--bg2)}
.cmt .st{color:#f5a623;letter-spacing:1px}
.cmt p{margin-top:8px;white-space:pre-wrap;word-wrap:break-word}
.empty{text-align:center;color:var(--muted);padding:22px}

footer{padding:36px 0 56px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}

/* ===== FINESTRA DEL PROGRAMMA (fedele a Monea) ===== */
.cv-wrap{width:100%;position:relative;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.cv-in{position:relative}
.cv{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32),0 0 0 1px rgba(0,0,0,.12)}
.mw{width:1000px;height:640px;display:flex;flex-direction:column;font-family:"Segoe UI","Segoe UI Variable",system-ui,-apple-system,Roboto,sans-serif;font-size:13px;line-height:1.35;color:var(--ink);background:var(--bg);text-align:left;user-select:none;-webkit-user-select:none}
.mw *{box-sizing:border-box;transition:background-color 1s ease,color 1s ease,border-color 1s ease,fill 1s,stroke 1s}
.mw button{font-family:inherit;cursor:pointer;color:inherit}
.mw .tbar{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding-left:12px;font-size:12px;border-bottom:1px solid var(--line)}
.mw .tbar .ico{width:14px;height:14px;border-radius:4px;background:var(--acc)}
.mw .tbar .ctl{margin-left:auto;display:flex;height:100%}
.mw .tbar .ctl span{width:44px;display:grid;place-items:center;color:var(--muted);font-size:11px}
.mw .body{flex:1;display:flex;min-height:0}
.mw .side{width:196px;flex:none;border-right:1px solid var(--line);padding:22px 12px 14px;display:flex;flex-direction:column;gap:3px}
.mw .brand{color:var(--acc);font-size:19px;font-weight:800;letter-spacing:3px;padding:0 10px 14px}
.mw .nav{padding:10px 13px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:600;border:0;background:none;text-align:left}
.mw .nav:hover{background:var(--hover);color:var(--ink)}
.mw .nav.on{background:var(--acc);color:var(--on-acc)}
.mw .main{flex:1;min-width:0;position:relative;overflow:hidden}
.mw .page{position:absolute;inset:0;padding:22px 26px 26px;overflow-y:auto;scrollbar-width:thin;animation:pgin .9s ease}
@keyframes pgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mw .head{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mw .h1{font-size:24px;font-weight:700;flex:1;white-space:nowrap}
.mw .h2{font-size:15px;font-weight:700}
.mw .lab{color:var(--muted);font-size:12px;font-weight:600}
.mw .mut{color:var(--muted);font-size:12px}
.mw .num{font-size:26px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mw .nsm{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.mw .pos{color:var(--pos);font-weight:700}.mw .neg{color:var(--neg);font-weight:700}
.mw .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mw .card.hr{background:var(--hero);border-color:var(--hero);color:var(--on-hero)}
.mw .card.hr .lab{color:var(--hero-muted)}
.mw .card.banner{background:var(--warn);border-color:var(--warn);color:var(--warn-ink);border-radius:12px;padding:10px 16px;flex-direction:row;align-items:center;gap:10px}
.mw .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mw .g2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:14px}
.mw .g2e{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.mw .mt{margin-top:14px}
.mw .b{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:13px;color:var(--ink)}
.mw .b:hover{background:var(--hover)}
.mw .b.p{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
.mw .b.s{padding:4px 10px;font-size:12px}
.mw .b.d{color:var(--neg)}
.mw .b:disabled{opacity:.45;cursor:default}
.mw .seg{display:flex}.mw .seg .b{border-radius:0;padding:7px 20px}.mw .seg .b:first-child{border-radius:9px 0 0 9px}.mw .seg .b:last-child{border-radius:0 9px 9px 0}
.mw .seg .b.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:600}
.mw .chip{display:inline-block;background:var(--chip);color:var(--chip-ink);border-radius:10px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.mw .chip.alt{background:var(--chip2);color:var(--chip2-ink)}
.mw .fld{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;outline:none;user-select:text;-webkit-user-select:text}
.mw .fld:focus{border-color:var(--acc)}
.mw .row3{display:flex;gap:8px;align-items:center}
.mw .sep{height:1px;background:var(--row);margin:2px 0}
.mw .cb{display:grid;grid-template-columns:118px 1fr 112px;align-items:center;gap:10px;height:34px}
.mw .cb .tr,.mw .pb{height:9px;border-radius:5px;background:var(--track);overflow:hidden}
.mw .cb .tr s,.mw .pb s{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width 1.8s cubic-bezier(.2,.7,.2,1) .2s,background-color 1s}
.mw .cb .vv{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.mw .cb .vv i{font-style:normal;color:var(--muted)}
.mw .trow{display:grid;grid-template-columns:84px 1fr 160px 96px 74px;align-items:center;gap:8px;padding:0 12px;height:40px;border-bottom:1px solid var(--row);font-size:12.5px}
.mw .trow.th{height:34px;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line)}
.mw .trow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw .trow .a{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mw .tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mw .trow.ir{grid-template-columns:26px 62px 1fr 150px 84px 150px}
.mw .ck{width:15px;height:15px;border-radius:4px;border:1px solid var(--muted);display:grid;place-items:center;font-size:10px;color:var(--on-acc)}
.mw .ck.on{background:var(--acc);border-color:var(--acc)}
.mw .sav{display:flex;flex-direction:column;gap:2px;min-height:208px}
.mw .sav .rates{font-size:12px;margin-top:2px}
.mw .acts{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.mw .li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--row)}
.mw .li:last-child{border:0}
.mw .li>div:first-child{flex:1;min-width:0}
.mw .sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);padding:0}
.mw .sw.on{border-color:var(--ink)}
.mw .step{display:flex;gap:22px;margin-bottom:12px;color:var(--muted);font-weight:600;font-size:13px}
.mw .step .on{color:var(--acc)}
.mw .mod{position:absolute;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;z-index:5;animation:fd .5s ease}
@keyframes fd{from{opacity:0}to{opacity:1}}
.mw .dlg{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px 20px;width:370px;display:flex;flex-direction:column;gap:6px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mw .dlg .acts{justify-content:flex-end;padding-top:10px}
.mw .flash{animation:fl 3.4s ease}
@keyframes fl{0%{background:var(--chip)}100%{background:transparent}}
.mw .lockc{align-items:center;text-align:center;padding:26px 20px;gap:8px}
.mw .lockc .l{font-size:46px;line-height:1}
.mw .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.mw .chips span{background:var(--chip);color:var(--chip-ink);border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:600}
.mw svg text{fill:var(--muted);font-size:10px;font-family:inherit}
.mw .vb{display:flex;align-items:flex-end;gap:5px;height:140px}
.mw .vb .m{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.mw .vb .pair{display:flex;align-items:flex-end;gap:2px;width:100%;height:100%;justify-content:center}
.mw .vb .pair s{display:block;width:34%;max-width:22px;border-radius:4px 4px 0 0;transition:height 1.8s cubic-bezier(.2,.7,.2,1) .2s}
.mw .vb .m small{font-size:11px;color:var(--muted)}
.mw .lg{display:flex;gap:14px;font-size:12px;color:var(--muted)}.mw .lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* ===== PAGINA STILE APPLE ===== */
.hero2{height:240vh;position:relative;background:linear-gradient(var(--bg),var(--bg2))}
.hero2-in{position:sticky;top:48px;height:calc(100vh - 48px);overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 22px}
.h-text{padding-top:5vh;will-change:transform,opacity}
.h-text .eyebrow{color:var(--accent);font-weight:600;font-size:19px}
.h-text h1{font-size:clamp(60px,14vw,140px);letter-spacing:-.045em;line-height:1;font-weight:700;padding-bottom:.06em;
  background:linear-gradient(120deg,var(--accent),#2fa89a 60%,#7fd1c4);-webkit-background-clip:text;background-clip:text;color:transparent}
.h-text .tag{font-size:clamp(19px,3.2vw,28px);color:var(--muted);max-width:680px;margin:10px auto 0}
.h-text .cta{margin:22px 0 0}
.h-stage{perspective:1500px;width:100%;display:flex;justify-content:center;margin-top:3vh}
.h-win{width:min(940px,100%);min-width:0;transform-origin:50% 0;will-change:transform}

.story{background:var(--bg)}
.story-grid{display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);gap:36px;max-width:1300px;margin:auto;padding:0 22px}
.chap{min-height:95vh;display:flex;flex-direction:column;justify-content:center;opacity:.22;transition:opacity .5s ease}
.chap.on{opacity:1}
.chap .eyebrow{color:var(--accent);font-weight:600;font-size:16px}
.chap h2{font-size:clamp(30px,3.6vw,46px);letter-spacing:-.035em;line-height:1.06;margin-top:8px}
.chap p{font-size:clamp(17px,1.6vw,19px);color:var(--muted);margin-top:14px}
.stagecol{position:relative}
.stage{position:sticky;top:max(64px,calc(50vh - var(--sh,300px)/2))}
@media(max-width:820px){
  .story-grid{grid-template-columns:1fr;gap:0}
  .stagecol{order:-1;position:sticky;top:48px;z-index:5;background:var(--bg);padding:10px 0 12px;align-self:start}
  .stage{position:static}
  .chap{min-height:70vh;justify-content:flex-start;padding-top:36px}
}
.dark{background:#000;color:#f5f5f7;text-align:center;padding:150px 22px}
.dark h2{font-size:clamp(38px,7.4vw,88px);letter-spacing:-.04em;line-height:1.04;font-weight:700}
.dark h2 span{background:linear-gradient(120deg,#3fb8b0,#9be3d9);-webkit-background-clip:text;background-clip:text;color:transparent}
.dark p{color:#a1a1a6;font-size:clamp(17px,2.4vw,24px);margin-top:22px;max-width:620px;margin-inline:auto}
.try-note{text-align:center;color:var(--muted);font-size:14px;margin-top:16px}

#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:30}

const PAL={

  scuro:{bg:"#12181C",card:"#1B2328",line:"#2B363D",row:"#242E34",ink:"#E8ECEE",muted:"#9AA8B1",pos:"#5FC48F",neg:"#F08A77",track:"#2B363D",hover:"#222C32",chip:"#1F3A36","chip-ink":"#9AD9CF",chip2:"#3A2F1C","chip2-ink":"#E5C48D",warn:"#3A2F1C","warn-ink":"#E5C48D"}
};
const ACC={petrolio:["Verde petrolio","#1F6F66","#4FB3A6"],oceano:["Blu oceano","#2F5F98","#6E9FD8"],prugna:["Viola prugna","#6E4C91","#A88BCB"],rame:["Rame","#9A5B30","#D29462"],bosco:["Verde bosco","#3E6B3A","#7FB06F"],mattone:["Rosso mattone","#A1453A","#E08A7C"],grafite:["Grafite","#3D4A55","#A3B1BD"]};
const MESI_N=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const MS=["Mag","Giu","Lug","Ago","Set","Ott"];           // mesi con dati (2026): indice 0 = maggio
const mTitle=i=>{const n=(i+4)%12;return MESI_N[n][0].toUpperCase()+MESI_N[n].slice(1)+" 2026";};
function money(c,signed){c=Math.round(c||0);let sg=c<0?"−":(signed&&c>0?"+":"");const a=Math.abs(c),w=Math.floor(a/100),f=String(a%100).padStart(2,"0");return `${sg}${String(w).replace(/\B(?=(\d{3})+(?!\d))/g,".")},${f} €`;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const SAVTL=[1118000,1256000,1389000,1527000,1640000,1741900];

}
const RULES=[["FORNO DA LUCA","Alimentazione"],["PALESTRA FIT CENTER","Salute"],["DISTRIBUTORE CARBURANTE","Trasporti"],["STREAMING FILM E SERIE","Tempo libero"]];

function MoneaApp(root,interactive){
  const A={root,S:null,timers:[]};
  const S=()=>A.S;
  A.slow=1;A.later=(ms,fn)=>{A.timers.push(setTimeout(fn,ms*A.slow));};
  A.clear=()=>{A.timers.forEach(clearTimeout);A.timers=[];};
  const q=sel=>root.querySelector(sel);

  /* ---------- calcoli ---------- */
  function summary(mi){
    let inc=0,exp=0;const g={};
    S().tx.filter(t=>t.mi===mi).forEach(t=>{
      if(t.sav){const sv=S().savings.find(x=>x.id===t.sav);if(!sv||sv.type==="libretto")return;exp-=t.a;g["Investimenti e salvadanai"]=(g["Investimenti e salvadanai"]||0)-t.a;}
      else{const c=S().cats.find(x=>x[0]===t.c);if(!c)return;if(c[1]==="entrata")inc+=t.a;else{exp-=t.a;g[t.c]=(g[t.c]||0)-t.a;}}
    });
    const groups=Object.entries(g).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
    return {inc,exp,left:inc-exp,groups};
  }
  function eta(sv){
    if(sv.value>=sv.target)return "obiettivo raggiunto";
    if(!sv.monthly)return "imposta un versamento mensile per stimare il traguardo";
    const n=Math.ceil((sv.target-sv.value)/sv.monthly),tot=2026*12+9+n;
    return "traguardo stimato: "+MESI_N[tot%12]+" "+Math.floor(tot/12);
  }
  const dayStr=t=>`${String(t.d).padStart(2,"0")}/${String((t.mi+4)%12+1).padStart(2,"0")}/2026`;
  const destChip=t=>{
    if(t.sav){const sv=S().savings.find(x=>x.id===t.sav);return `<span class="chip alt">${SAV_SHORT[sv.type]} · ${esc(sv.name)}</span>`;}
    if(!t.c)return `<span class="chip alt">Da classificare</span>`;
    const c=S().cats.find(x=>x[0]===t.c);return `<span class="chip ${c&&c[1]==="entrata"?'alt':''}">${esc(t.c)}</span>`;
  };
  const bars=(items,total)=>{const mx=Math.max(1,...items.map(x=>x[1]));
    if(!items.length)return `<div class="mut">Nessuna spesa in questo periodo.</div>`;
    return items.map(([n,v])=>`<div class="cb"><span>${esc(n)}</span><span class="tr"><s data-w="${v/mx*100}" style="width:0"></s></span><span class="vv">${money(v).replace(",00","")} <i>${Math.round(v*100/total)}%</i></span></div>`).join("");};

  /* ---------- pagine ---------- */
  const nav=(m)=>`<div class="head"><div class="h1">${m.t}</div>${m.b||""}</div>`;
  const monthBtns=()=>`<button class="b" data-act="prev" ${S().mi===0?"disabled":""}>‹ Precedente</button><button class="b" data-act="next" ${S().mi===5?"disabled":""}>Successivo ›</button>`;

  function vDash(){
    const s=summary(S().mi),saved=s.groups.find(x=>x[0]==="Investimenti e salvadanai"),tot=s.groups.reduce((a,x)=>a+x[1],0);
    const tl=SAVTL.slice(0,S().mi+1),mx=Math.max(...tl),mn=Math.min(...tl),W=300,H=120;
    const pts=tl.map((v,i)=>[10+i*(W-20)/Math.max(1,tl.length-1),H-8-(v-mn)/Math.max(1,mx-mn)*(H-26)]);
    const line=pts.map(p=>p.join(",")).join(" "),area=`10,${H} ${line} ${pts[pts.length-1][0]},${H}`;
    return `<div class="page">${nav({t:mTitle(S().mi),b:monthBtns()})}
    <div class="g3">
      <div class="card hr"><span class="lab">Spese del mese</span><span class="num">${money(s.exp)}</span><span class="lab">${saved?"di cui "+money(saved[1])+" messi da parte":"&nbsp;"}</span></div>
      <div class="card"><span class="lab">Entrate</span><span class="num">${money(s.inc)}</span></div>
      <div class="card"><span class="lab">Rimasto nel mese</span><span class="num" style="${s.left<0?'color:var(--neg)':''}">${money(s.left)}</span></div>
    </div>
    <div class="g2"><div class="card" style="gap:6px"><span class="h2">Dove vanno i soldi</span>${bars(s.groups,tot)}</div>
      <div class="card"><span class="h2">Come crescono i risparmi</span><span class="num">${money(tl[tl.length-1])}</span><span class="lab">${money(tl[tl.length-1]-tl[0],true)} da ${MESI_N[4].toLowerCase()} 2026</span>
      <svg viewBox="0 0 ${W} ${H+14}" style="width:100%;margin-top:8px"><polygon points="${area}" style="fill:var(--acc);opacity:.13"/><polyline points="${line}" style="fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" style="fill:var(--acc)"/>`).join("")}<text x="10" y="${H+11}">${MS[0]}</text><text x="${W-10}" y="${H+11}" text-anchor="end">${MS[S().mi]}</text></svg></div></div></div>`;
  }

  function movRows(){
    let l=S().tx.filter(t=>t.mi===S().mi);
    const sq=S().q.trim().toLowerCase();if(sq)l=l.filter(t=>t.desc.toLowerCase().includes(sq));
    const f=S().fcat;if(f==="none")l=l.filter(t=>!t.c&&!t.sav);else if(f)l=l.filter(t=>t.c===f);
    if(S().fsign==="out")l=l.filter(t=>t.a<0);if(S().fsign==="in")l=l.filter(t=>t.a>0);
    l.sort((a,b)=>b.d-a.d||b.id-a.id);
    const filtered=!!(sq||f||S().fsign);
    return {n:l.length,filtered,html:l.map(t=>`<div class="trow ${t.fresh?'flash':''}"><span>${dayStr(t)}</span><span class="t" title="${esc(t.desc)}">${esc(t.desc)}</span><span>${destChip(t)}</span><span class="a ${t.a>0?'pos':'neg'}">${money(t.a,true)}</span><span><button class="b s" data-act="noop">Modifica</button></span></div>`).join("")||`<div class="mut" style="padding:16px">Nessun movimento corrisponde ai filtri.</div>`};
  }
  function vMov(){
    const m=movRows();
    return `<div class="page">${nav({t:"Movimenti · "+mTitle(S().mi),b:monthBtns()+`<button class="b" data-act="newtx">Nuovo movimento</button><button class="b p" data-act="nav" data-a="imp">Importa da Excel</button>`})}
    <div class="row3"><input id="q" class="fld" placeholder="Cerca per descrizione" value="${esc(S().q)}" style="flex:1">
      <select id="fcat" class="fld" style="width:190px"><option value="">Tutte le categorie</option><option value="none">Da classificare</option>${S().cats.map(c=>`<option ${S().fcat===c[0]?"selected":""}>${esc(c[0])}</option>`).join("")}</select>

  function savCard(sv){
    let h=`<span class="lab">${SAV_LBL[sv.type].toUpperCase()}</span><span class="h2">${esc(sv.name)}</span><div style="height:6px"></div>`,acts="";
    if(sv.type==="investimento"){
      const gain=sv.value-sv.paid,pct=gain/sv.paid*100;
      h+=`<span class="lab">Versato ${money(sv.paid)}</span><span class="nsm">${money(sv.value)}</span><span class="${gain>=0?'pos':'neg'}">${money(gain,true)} · ${(pct>=0?"+":"−")+Math.abs(pct).toFixed(1).replace(".",",")}%</span><span class="mut">Valore aggiornato il 28/10/2026</span>`;
      if(sv.end)h+=`<span class="mut">Scadenza: ${sv.end}</span>`;
      if(sv.plan){h+=`<span class="lab" style="margin-top:4px">Rata ${money(sv.plan.cents)} · ${sv.plan.every}</span><span class="rates" style="color:${sv.plan.pend?'var(--neg)':'var(--muted)'};${sv.plan.pend?'font-weight:600':''}">Rate: ${sv.plan.ok} confermate${sv.plan.pend?` · ${sv.plan.pend} da confermare (l'ultima di ${sv.plan.last})`:""}</span>`;acts=`<button class="b s p" data-act="noop">Aggiorna valore</button><button class="b s" data-act="noop">Rate</button>`;}
      else acts=`<button class="b s p" data-act="noop">Aggiorna valore</button><button class="b s" data-act="noop">Versamento</button>`;
    }else if(sv.type==="salvadanaio"){
      const p=Math.min(1,sv.value/sv.target);
      h+=`<span class="lab">Obiettivo ${money(sv.target)}</span><span class="nsm">${money(sv.value)}</span><div class="pb" style="margin:6px 0 2px"><s data-w="${p*100}" style="width:0"></s></div><span class="mut">${Math.round(p*100)}% raggiunto · ${eta(sv)}</span>`;
      acts=`<button class="b s p" data-act="vers" data-id="${sv.id}">Versamento</button>`;
    }else{
      h+=`<span class="lab">Saldo</span><span class="nsm">${money(sv.value)}</span><span class="mut">Saldo aggiornato il 28/10/2026</span>`;
      acts=`<button class="b s p" data-act="noop">Aggiorna saldo</button><button class="b s" data-act="noop">Sposta soldi</button>`;
    }
    return `<div class="card sav ${sv.fresh?'flash':''}">${h}<div class="acts">${acts}</div><div class="acts" style="padding-top:2px"><button class="b s" data-act="noop">Storico</button><button class="b s" data-act="noop">Modifica</button></div></div>`;
  }
  function vSav(){

    const parts=[["investimento","investiti"],["salvadanaio","nei salvadanai"],["libretto","sui libretti"]].filter(p=>sv.some(s=>s.type===p[0])).map(p=>`${money(tot[p[0]])} ${p[1]}`).join(" · ");

  function vStat(){
    const ms=[0,1,2,3,4,5].map(i=>({i,...summary(i)}));
    const inc=ms.reduce((a,m)=>a+m.inc,0),exp=ms.reduce((a,m)=>a+m.exp,0),mx=Math.max(...ms.flatMap(m=>[m.inc,m.exp]));

    const rt=rec.reduce((a,x)=>a+x[1],0),avg=exp/6;
    return `<div class="page">${nav({t:"Statistiche · 2026",b:`<button class="b" disabled>‹ Anno prima</button><button class="b" disabled>Anno dopo ›</button>`})}

      <div class="vb">${ms.map(m=>`<div class="m"><div class="pair"><s data-h="${m.inc/mx*100}" style="height:0;background:var(--pos)"></s><s data-h="${m.exp/mx*100}" style="height:0;background:var(--neg)"></s></div><small>${MS[m.i]}</small></div>`).join("")}</div></div>
    <div class="g2e"><div class="card" style="gap:6px"><span class="h2">Spese per categoria nell'anno</span>${bars(cl,ct)}</div>

      ${rec.map(r=>`<div class="li"><div><div>${r[0]}</div><div class="mut">ogni mese · rilevata 6 volte</div></div><b>${money(r[1])}</b></div>`).join("")}</div></div></div>`;
  }

    <div class="card lockc"><span class="l">🔒</span><span class="h2" style="font-size:20px">Solo sul tuo computer</span><span class="mut" style="font-size:13px">I tuoi dati sono in: %LOCALAPPDATA%\\Monea8</span><div class="chips"><span>Nessun account</span><span>Nessun cloud</span><span>Nessun abbonamento</span></div></div>
    <div class="card mt" style="gap:6px"><span class="h2">Backup</span><span class="mut" style="font-size:13px">Ultima copia automatica: oggi alle 08:12. Monea fa una copia ogni volta che lo apri e lo chiudi, e prima di ogni operazione importante (importazioni, eliminazioni, ripristini).</span><div class="row3"><button class="b p" data-act="noop">Crea copia ora</button><button class="b" data-act="noop">Ripristina da file</button><button class="b" data-act="noop">Apri cartella dei backup</button></div></div>

  const VIEWS={dash:vDash,mov:vMov,imp:vImp,sav:vSav,stat:vStat,set:vSet,dati:vDati};
  const NAVS=[["dash","Dashboard"],["mov","Movimenti"],["imp","Importa"],["sav","Risparmi"],["stat","Statistiche"],["set","Impostazioni"]];

  /* ---------- aspetto ---------- */
  function look(){
    const p=PAL[S().theme],a=ACC[S().accent],dk=S().theme==="scuro",acc=dk?a[2]:a[1];
    const v={...p,acc,"on-acc":dk?"#10181B":"#FFFFFF",hero:acc,"on-hero":dk?"#10181B":"#FFFFFF","hero-muted":dk?"#1E2B30":"#E3EEEC"};
    Object.entries(v).forEach(([k,x])=>root.style.setProperty("--"+k,x));
  }
  A.setLook=(theme,accent)=>{
    if(theme)S().theme=theme;if(accent)S().accent=accent;look();
    root.querySelectorAll(".seg .b").forEach(b=>b.classList.toggle("on",b.dataset.v===S().theme));
    root.querySelectorAll(".sw").forEach(b=>{b.classList.toggle("on",b.dataset.v===S().accent);b.style.background=S().theme==="scuro"?ACC[b.dataset.v][2]:ACC[b.dataset.v][1];});
    const n=q("#accname");if(n)n.textContent=ACC[S().accent][0]+" · cambia menu, pulsanti, barre e grafici.";
  };

  /* ---------- struttura e animazioni ---------- */
  function frame(){
    root.innerHTML=`<div class="tbar"><span class="ico"></span>Monea<div class="ctl"><span>—</span><span>☐</span><span>✕</span></div></div>
    <div class="body"><div class="side"><div class="brand">MONEA</div>${NAVS.map(n=>`<button class="nav" data-act="nav" data-a="${n[0]}">${n[1]}</button>`).join("")}</div><div class="main" id="mainarea"></div></div>`;
  }
  function animate(){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      root.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");
      root.querySelectorAll("[data-h]").forEach(e=>e.style.height=e.dataset.h+"%");
    }));
  }
  A.show=(page,keepModal)=>{
    S().page=page;
    const act=page==="dati"?"set":page;
    root.querySelectorAll(".nav").forEach(b=>b.classList.toggle("on",b.dataset.a===act));
    const main=q("#mainarea");main.innerHTML=VIEWS[page]()+(S().modal?modalHTML():"");
    animate();
  };
  A.reset=()=>{A.S=freshState();look();frame();};
  A.scrollTo=(y,smooth=true)=>{const p=q(".page");if(p)p.scrollTo({top:y===-1?p.scrollHeight:y,behavior:smooth?"smooth":"auto"});};

  /* ---------- finestre di dialogo ---------- */
  function modalHTML(){
    const m=S().modal;if(!m)return "";
    if(m.k==="sav"){
      const t=m.type;
      return `<div class="mod"><div class="dlg"><span class="h2" style="font-size:17px">Nuovo risparmio</span>
        <span class="lab">Tipo</span><select id="f-type" class="fld" data-act="savtype">${Object.entries(SAV_LBL).map(([k,v])=>`<option value="${k}" ${k===t?"selected":""}>${v}</option>`).join("")}</select>
        <span class="lab">Nome</span><input id="f-name" class="fld" placeholder="Per esempio: PAC Mondo, Fondo mutuo, Libretto">
        ${t==="salvadanaio"?`<span class="lab">Obiettivo</span><input id="f-target" class="fld" placeholder="0,00"><span class="lab">Versamento mensile previsto (facoltativo)</span><input id="f-monthly" class="fld" placeholder="0,00">`
          :`<span class="lab">${t==="libretto"?"Saldo iniziale":"Valore iniziale"}</span><input id="f-init" class="fld" placeholder="0,00">${t==="investimento"?`<span class="lab">Versamento programmato (per esempio un PAC)</span><div class="row3"><select class="fld"><option>Ogni mese</option><option>Ogni 3 mesi</option><option>Ogni anno</option></select><input class="fld" placeholder="Importo della rata"></div>`:""}`}
        <div class="acts"><button class="b" data-act="mcancel">Annulla</button><button class="b p" data-act="savsave">Salva</button></div></div></div>`;
    }
    if(m.k==="cat")return `<div class="mod"><div class="dlg"><span class="h2" style="font-size:17px">${m.old?"Rinomina categoria":"Nuova categoria"}</span><span class="lab">Nome</span><input id="f-cname" class="fld" value="${esc(m.old||"")}" placeholder="Per esempio: Animali"><div class="acts"><button class="b" data-act="mcancel">Annulla</button><button class="b p" data-act="catsave">Salva</button></div></div></div>`;
    if(m.k==="del")return `<div class="mod"><div class="dlg"><span class="h2" style="font-size:17px">Conferma eliminazione</span><span>Sei sicuro di voler eliminare la categoria «${esc(m.old)}»? I suoi movimenti passano a «Altro».</span><div class="acts"><button class="b" data-act="mcancel">No, tienila</button><button class="b d" data-act="catdelok">Sì, elimina</button></div></div></div>`;
    return "";
  }
  A.openSav=()=>{S().modal={k:"sav",type:"investimento"};A.show(S().page);};

  const num=v=>{v=String(v||"").replace(/\./g,"").replace(",",".").replace(/[^\d.]/g,"");return Math.round((parseFloat(v)||0)*100);};
  A.saveSav=()=>{
    const m=S().modal,name=(q("#f-name").value||"").trim();if(!name){q("#f-name").focus();return;}
    const id=S().nextId++,sv={id,type:m.type,name,fresh:true};
    if(m.type==="salvadanaio"){sv.value=0;sv.target=num(q("#f-target").value)||100000;sv.monthly=num(q("#f-monthly").value);}
    else{sv.value=num(q("#f-init")&&q("#f-init").value);if(m.type==="investimento")sv.paid=sv.value;}
    S().savings.push(sv);S().modal=null;A.show("sav");

  };
  A.addCat=(name,kind,flash)=>{
    name=(name||"").trim();if(!name||S().cats.some(c=>c[0].toLowerCase()===name.toLowerCase()))return;
    S().cats.splice(S().cats.length-1,0,[name,kind||"spesa"]);S().flashCat=flash?name:null;S().modal=null;

  A.impChoose=()=>{S().imp.step=2;A.show("imp");};
  A.typeInto=(sel,text,delay,done)=>{const el=q(sel);if(!el)return;let i=0;const go=()=>{const e=q(sel);if(!e)return;e.value=text.slice(0,++i);if(i<text.length)A.later(delay,go);else if(done)done();};go();};

  /* ---------- azioni (clic) ---------- */
  function onClick(e){
    const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT")return;
    const a=b.dataset.act,s=S();
    if(a==="nav"){s.page=b.dataset.a;if(s.page==="imp")s.imp.step=1;A.show(s.page);}
    else if(a==="prev"||a==="next"){s.mi=Math.max(0,Math.min(5,s.mi+(a==="next"?1:-1)));A.show(s.page);}
    else if(a==="newtx"){s.form=!s.form;A.show("mov");}
    else if(a==="addtx"){const d=q("#nd").value.trim(),v=num(q("#na").value);if(!d||!v)return;s.tx.push({id:s.nextId++,mi:s.mi,d:28,desc:d.toUpperCase(),c:q("#nc").value,a:-v,fresh:true});s.form=false;A.show("mov");s.tx.forEach(t=>delete t.fresh);}
    else if(a==="impchoose")A.impChoose();
    else if(a==="impback"){s.imp.step=1;A.show("imp");}
    else if(a==="impsave"){let n=0;IMPORT_ROWS.filter(r=>r.st==="nuovo").forEach(r=>{s.tx.push({id:s.nextId++,mi:5,d:r.day,desc:r.desc,c:r.sav?null:(r.c||"Tempo libero"),a:r.a,sav:r.sav,imp:1});n++;});s.imp.done=[{n}];s.imp.step=1;s.imp.banner=`Importati ${n} movimenti. Saltata 1 riga già presente.`;A.show("imp");}
    else if(a==="impundo"){s.tx=s.tx.filter(t=>!t.imp);s.imp.done=[{n:0,undone:true}];s.imp.banner="Importazione annullata: tolti 5 movimenti.";A.show("imp");}
    else if(a==="vers"){const sv=s.savings.find(x=>x.id==b.dataset.id);sv.value+=10000;A.show("sav");}
    else if(a==="savadd")A.openSav();
    else if(a==="savsave")A.saveSav();
    else if(a==="theme")A.setLook(b.dataset.v);
    else if(a==="accent")A.setLook(null,b.dataset.v);
    else if(a==="catadd"){s.modal={k:"cat"};A.show("set");const p=q("#setpage");}
    else if(a==="catren"){s.modal={k:"cat",old:b.dataset.n};A.show("set");}
    else if(a==="catdel"){s.modal={k:"del",old:b.dataset.n};A.show("set");}
    else if(a==="catsave"){const v=q("#f-cname").value.trim(),m=s.modal;if(!v)return;if(m.old){const c=s.cats.find(x=>x[0]===m.old);s.tx.forEach(t=>{if(t.c===m.old)t.c=v;});c[0]=v;s.modal=null;A.show("set");}else A.addCat(v,"spesa",true);}
    else if(a==="catdelok"){const n=s.modal.old;if(s.cats.filter(c=>c[1]==="entrata").length===1&&s.cats.find(c=>c[0]===n)[1]==="entrata"){s.modal=null;A.show("set");return;}s.tx.forEach(t=>{if(t.c===n)t.c="Altro";});s.cats=s.cats.filter(c=>c[0]!==n);s.modal=null;A.show("set");}
    else if(a==="mcancel"){s.modal=null;A.show(s.page);}
  }
  function onInput(e){
    if(e.target.id==="q"){S().q=e.target.value;updMov();}
    else if(e.target.id==="fcat"){S().fcat=e.target.value;updMov();}
    else if(e.target.id==="fsign"){S().fsign=e.target.value;updMov();}
    else if(e.target.id==="f-type"){A.setSavType(e.target.value);}
  }
  if(interactive){root.addEventListener("click",onClick);root.addEventListener("input",onInput);root.addEventListener("change",onInput);}
  else root.style.pointerEvents="none";
  root.classList.add("mw");
  A.reset();
  return A;
}

/* ---------- COMMENTI ---------- */
const CM_KEY="monea-commenti-demo";
function cmLoad(){try{return JSON.parse(localStorage.getItem(CM_KEY)||"[]")}catch(e){return[]}}
function cmSave(a){try{localStorage.setItem(CM_KEY,JSON.stringify(a))}catch(e){}}
let cmMem=null, cmStars=0;
function cmListHTML(){
  const a=cmMem; if(!a.length)return '<div class="empty">Ancora nessun commento. Scrivi tu il primo!</div>';
  return a.slice().reverse().map(c=>`<div class="cmt"><div class="h"><b>${esc(c.n)}</b>${c.s?`<span class="st">${"★".repeat(c.s)}${"☆".repeat(5-c.s)}</span>`:''}<span class="tg">${esc(c.t)}</span><span>${esc(c.dt)}</span></div><p>${esc(c.x)}</p></div>`).join("");
}
function mountComments(){
  const box=document.getElementById("cm-box"); if(!box)return;
  if(GISCUS.repo){
    const s=document.createElement("script");
    s.src="https://giscus.app/client.js"; s.async=true; s.crossOrigin="anonymous";

      mapping:"specific",term:"Monea",strict:"0","reactions-enabled":"1","emit-metadata":"0","input-position":"top",
      theme:"preferred_color_scheme",lang:"it",loading:"lazy"}).forEach(([k,v])=>s.setAttribute("data-"+k,v));

  box.innerHTML=`<form id="cmf">
    <div class="two"><div><label for="cn">Il tuo nome</label><input type="text" id="cn" maxlength="30" placeholder="Come ti chiami?" required></div>
    <div><label for="ct">Di cosa si tratta</label><select id="ct"><option>Opinione</option><option>Idea per migliorarla</option><option>Problema riscontrato</option></select></div></div>
    <div><label>Il tuo voto</label><div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<button type="button" data-s="${i}" aria-label="${i} stelle">★</button>`).join("")}</div></div>
    <div><label for="cx">Cosa ne pensi? Come la miglioreresti?</label><textarea id="cx" maxlength="800" placeholder="Scrivi qui…" required></textarea></div>
    <button class="send" type="submit">Invia commento</button></form>
    <div class="cm-list" id="cml">${cmListHTML()}</div>
    <p class="note">Anteprima: qui i commenti restano solo nel tuo browser. Sul sito vero saranno pubblici, raccolti tramite GitHub.</p>`;
  const st=box.querySelector("#stars");
  st.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cmStars=+b.dataset.s;st.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.s<=cmStars));});
  box.querySelector("#cmf").addEventListener("submit",e=>{
    e.preventDefault();
    cmMem.push({n:box.querySelector("#cn").value.trim(),t:box.querySelector("#ct").value,s:cmStars,x:box.querySelector("#cx").value.trim(),dt:new Date().toLocaleDateString("it-IT")});
    cmSave(cmMem); box.querySelector("#cml").innerHTML=cmListHTML();
    e.target.reset(); cmStars=0; st.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
  });
}

let HERO=null,STAGE=null,DEMO=null;
function scene(i){
  const A=STAGE;A.clear();A.reset();const L=A.later;
  switch(i){
    case 0:A.show("dash");break;
    case 1:A.show("mov");L(1500,()=>{let n=0;const t="supermercato";(function go(){n=Math.min(t.length,n+2);A.setSearch(t.slice(0,n));if(n<t.length)L(180,go);})();});break;
    case 2:A.show("imp");L(1800,()=>A.impChoose());break;
    case 3:A.show("sav");L(3200,()=>A.openSav());L(4000,()=>A.setSavType("salvadanaio"));
      L(4800,()=>A.typeInto("#f-name","Vacanze 2027",90));L(6400,()=>A.typeInto("#f-target","2500",120));L(7300,()=>A.typeInto("#f-monthly","150",120));
      L(8600,()=>{A.saveSav();L(900,()=>A.scrollTo(-1));});break;
    case 4:A.show("stat");break;
    case 5:A.show("set");L(1200,()=>A.scrollTo(250));L(3400,()=>A.addCat("Animali","spesa",true));break;
    case 6:A.show("set");A.scrollTo(0,false);
      [["oceano",1500],["prugna",3200],["rame",4900],["bosco",6600]].forEach(([k,t])=>L(t,()=>A.setLook(null,k)));
      L(8500,()=>A.setLook("scuro","oceano"));L(10800,()=>A.setLook(null,"petrolio"));break;
    case 7:A.show("dati");break;
  }
}

/* ---------- animazioni a scorrimento ---------- */
let OBS=[];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function fit(){
  document.querySelectorAll(".cv-wrap").forEach(w=>{
    const min=+w.dataset.min||0,s=Math.max(min,w.clientWidth/1000),inn=w.firstElementChild;
    inn.style.width=(1000*s)+"px";inn.style.height=(640*s)+"px";inn.firstElementChild.style.transform=`scale(${s})`;
  });
  const sg=document.getElementById("stage"),st=sg&&sg.querySelector(".cv-wrap");
  if(st)sg.style.setProperty("--sh",(640*st.clientWidth/1000)+"px");
}
function setupStory(){
  OBS.forEach(o=>o.disconnect());OBS=[];
  const chaps=[...document.querySelectorAll(".chap")];if(!chaps.length)return;
  let cur=-1;
  const go=i=>{if(i===cur)return;cur=i;chaps.forEach((c,j)=>c.classList.toggle("on",j===i));scene(i);};
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)go(+e.target.dataset.i);}),{rootMargin:"-48% 0px -48% 0px"});
  chaps.forEach(c=>io.observe(c));OBS.push(io);
  const io2=new IntersectionObserver(es=>{if(es[0].isIntersecting&&cur<0)go(0);},{threshold:.15});
  io2.observe(document.getElementById("stage"));OBS.push(io2);
}
function reveal(){
  const els=document.querySelectorAll(".rv");
  if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12});
  els.forEach(e=>io.observe(e));OBS.push(io);
}
const REDUCE=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
let tick=false;
function heroScroll(){
  tick=false;
  const h=document.getElementById("hero2");if(!h)return;
  const r=h.getBoundingClientRect(),total=Math.max(1,h.offsetHeight-innerHeight);
  const p=REDUCE?1:clamp(-r.top/total),e=1-Math.pow(1-p,2),tf=REDUCE?0:clamp((p-.55)/.4);
  document.getElementById("hwin").style.transform=`rotateX(${(1-e)*24}deg) scale(${.84+.16*e}) translateY(${(1-e)*16}vh)`;
  const t=document.getElementById("htext");t.style.opacity=1-tf;t.style.transform=`translateY(${-tf*50}px)`;
}
function counter(){
  if(!SITE.repo)return;
  fetch(`https://api.github.com/repos/${SITE.repo}/releases`).then(r=>r.json()).then(rs=>{
    const n=rs.reduce((a,r)=>a+r.assets.reduce((b,x)=>b+(x.download_count||0),0),0),el=document.getElementById("dcnt");
    if(el)el.textContent=n.toLocaleString("it-IT");
  }).catch(()=>{const el=document.getElementById("dcnt");if(el)el.closest("div").remove();});
}
function progress(){const h=document.documentElement.scrollHeight-innerHeight;document.getElementById("prog").style.width=(h>0?scrollY/h*100:0)+"%";}
window.addEventListener("scroll",()=>{progress();if(!tick){tick=true;requestAnimationFrame(heroScroll);}},{passive:true});
window.addEventListener("resize",()=>{fit();heroScroll();});

/* ---------- navigazione ---------- */
function route(){
  const id=location.hash.replace("#","");
  const p=PROJECTS.find(x=>x.id===id);
  const home=document.getElementById("home"),det=document.getElementById("detail"),back=document.getElementById("back");
  OBS.forEach(o=>o.disconnect());OBS=[];
  if(STAGE)STAGE.clear();if(HERO)HERO.clear();
  if(p){
    document.documentElement.style.setProperty('--pa-l',p.color);document.documentElement.style.setProperty('--pa-d',p.colorDark);det.innerHTML=renderDetail(p);home.classList.add("hidden");det.classList.remove("hidden");back.classList.remove("hidden");
    document.title=p.nome+" — ncesko";window.scrollTo(0,0);
    HERO=MoneaApp(document.getElementById("appH"),false);HERO.show("dash");
    STAGE=MoneaApp(document.getElementById("appS"),false);STAGE.slow=1.7;STAGE.show("dash");
    DEMO=MoneaApp(document.getElementById("appD"),true);DEMO.show("dash");
    mountComments();fit();setupStory();reveal();heroScroll();counter();
  }else{
    document.documentElement.style.removeProperty("--pa-l");document.documentElement.style.removeProperty("--pa-d");
    det.classList.add("hidden");home.classList.remove("hidden");back.classList.add("hidden");
    document.title="ncesko — Progetti";
  }
}
document.addEventListener("click",e=>{
  const fb=e.target.closest("#filters button");if(fb){FILTER=fb.dataset.f;renderHome();return;}
  const sc=e.target.closest("[data-scroll]");
  if(sc){e.preventDefault();document.getElementById(sc.dataset.scroll).scrollIntoView({behavior:"smooth"});}
});
renderHome();route();
window.addEventListener("hashchange",route);
</script>
