async function scegliRaccolta(tipo) {
  const album = tipo === "album";
  let lista;
  if (album) lista = await get("/api/album");
  else { const d = await get("/api/cartelle"); lista = [{ id: 0, nome: "Da archiviare", n: d.da_archiviare, speciale: true }, ...d.cartelle]; }
  const recenti = lista.filter(x => x.ultimo_uso).sort((a, b) => b.ultimo_uso.localeCompare(a.ultimo_uso)).slice(0, 6);
  const tile = x => `<button class="rtile ${x.speciale ? "spec" : ""}" data-id="${x.id}">
      <span class="rcov">${album ? "❏" : x.speciale ? "📥" : "▤"}${x.copertina ? `<img class="cimg" src="${MINI(x.copertina)}" onerror="this.remove()" alt="">` : ""}</span>
      <span class="rt">${esc(x.nome)}</span><span class="rn">${x.percorso && x.percorso !== x.nome ? esc(x.percorso.split(" › ").slice(0, -1).join(" › ")) + " · " : ""}${plur(x.n || 0, album ? "elemento" : "documento", album ? "elementi" : "documenti")}</span></button>`;
  return new Promise(res => {
    modale(`<h2>${album ? "Aggiungi ad album" : "Sposta in cartellina"}</h2>
      <input type="text" id="r-q" placeholder="${album ? "Cerca un album o scrivi il nome di uno nuovo" : "Cerca una cartellina o scrivi il nome di una nuova"}" autocomplete="off">
      <div id="r-corpo"></div>
      <div class="foot"><span class="note" style="margin-right:auto">Invio = scegli il primo · Esc = chiudi</span><button id="m-annulla">Annulla</button></div>`, "larga");
    const fine = v => { chiudiModale(); res(v); };
    const disegna = () => {
      const q = $("#r-q").value.trim().toLowerCase();
      const trovati = lista.filter(x => !q || (x.percorso || x.nome).toLowerCase().includes(q));
      const esatto = lista.some(x => x.nome.toLowerCase() === q);
      let h = "";
      if (q && !esatto) h += `<div class="rgrid"><button class="rtile nuovo" data-nuovo="1"><span class="rcov">＋</span><span class="rt">Crea «${esc($("#r-q").value.trim())}»</span><span class="rn">${album ? "nuovo album" : "nuova cartellina"}</span></button></div>`;
      if (!q && recenti.length) h += `<div class="rsep">Usati di recente</div><div class="rgrid">${recenti.map(tile).join("")}</div>`;
      h += `<div class="rsep">${q ? "Risultati" : album ? "Tutti gli album" : "Tutte le cartelline"}</div>`;
      h += trovati.length ? `<div class="rgrid">${trovati.map(tile).join("")}</div>` : `<p class="note">Nessun risultato.</p>`;
      $("#r-corpo").innerHTML = h;
      $$("#r-corpo [data-id]").forEach(b => b.onclick = () => fine({ id: +b.dataset.id }));
      $$("#r-corpo [data-nuovo]").forEach(b => b.onclick = () => fine({ nuovo: $("#r-q").value.trim() }));
    };
    $("#r-q").oninput = disegna;
    $("#r-q").onkeydown = e => {
      if (e.key === "Escape") return fine(null);
      if (e.key !== "Enter") return;
      const primo = $("#r-corpo .rtile"); if (primo) primo.click();
    };
    $("#m-annulla").onclick = () => fine(null);
    disegna(); $("#r-q").focus();
  });
}

/* =================== trascinamento su album e cartelline =================== */
function iniziaTrascina(e, it) {
  const ids = S.sel.has(it.id) ? [...S.sel] : [it.id];
  const scelti = S.items.filter(x => ids.includes(x.id));
  S.trascina = { ids, media: scelti.some(x => ["Foto", "Video"].includes(x.tipo)), docs: scelti.some(x => !["Foto", "Video"].includes(x.tipo)) };
  e.dataTransfer.effectAllowed = "copyMove";
  e.dataTransfer.setData("text/x-arca", ids.join(","));
  const g = document.createElement("div"); g.className = "dragghost"; g.textContent = plur(ids.length, "file", "file");
  document.body.appendChild(g); e.dataTransfer.setDragImage(g, 20, 20); setTimeout(() => g.remove(), 0);
  mostraDock();
}
function fineTrascina() { S.fineDrag = Date.now(); setTimeout(() => { $("#dock").hidden = true; S.trascina = null; }, 50); }
async function mostraDock() {
  const t = S.trascina; if (!t) return;
  const dock = $("#dock");
  dock.innerHTML = `<div class="dtit">Rilascia su…</div><div id="dock-corpo" class="note">Carico…</div>`; dock.hidden = false;
  const [al, ca] = await Promise.all([t.media ? get("/api/album") : [], t.docs ? get("/api/cartelle") : null]);
  if (!S.trascina) return;
  const ordina = l => [...l].sort((a, b) => (b.ultimo_uso || "").localeCompare(a.ultimo_uso || "") || b.n - a.n).slice(0, 8);
  const voce = (k, x, icona) => `<div class="dtar" data-k="${k}" data-id="${x.id}"><span class="rcov">${icona}${x.copertina ? `<img class="cimg" src="${MINI(x.copertina)}" onerror="this.remove()" alt="">` : ""}</span><span>${esc(x.nome)}</span></div>`;
  let h = "";
  if (t.media) h += `<div class="sep">Album</div>${ordina(al).map(x => voce("album", x, "❏")).join("")}<div class="dtar nuovo" data-k="album-nuovo"><span class="rcov">＋</span><span>Nuovo album…</span></div>`;
  if (t.docs) h += `<div class="sep">Cartelline</div>${voce("cart", { id: 0, nome: "Da archiviare" }, "📥")}${ordina(ca.cartelle).map(x => voce("cart", x, "▤")).join("")}<div class="dtar nuovo" data-k="cart-nuova"><span class="rcov">＋</span><span>Nuova cartellina…</span></div>`;
  $("#dock-corpo").outerHTML = `<div>${h}</div>`;
  $$("#dock .dtar").forEach(el => {
    el.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; el.classList.add("over"); };
    el.ondragleave = () => el.classList.remove("over");
    el.ondrop = async e => {
      e.preventDefault(); e.stopPropagation();
      const tr = S.trascina; $("#dock").hidden = true; S.trascina = null;
      if (!tr) return;
      try {
        const k = el.dataset.k;
        if (k === "album") fatto((await aggiungiAdAlbum({ id: +el.dataset.id }, tr.ids)).op);
        if (k === "cart") fatto((await spostaInCartella({ id: +el.dataset.id }, tr.ids)).op);
        if (k === "album-nuovo") { const n = await chiedi("Nuovo album", "Nome dell'album", ""); if (n) fatto((await aggiungiAdAlbum({ nuovo: n }, tr.ids)).op); }
        if (k === "cart-nuova") { const n = await chiedi("Nuova cartellina", "Nome della cartellina", ""); if (n) fatto((await spostaInCartella({ nuovo: n }, tr.ids)).op); }
      } catch (err) { toast(err.message); }
      S.sel.clear(); aggiornaSelbar(); caricaItems(true); caricaFiltri();
    };
  });
}

function disegnaAlbero() {
  const tutte = S.cartelleTutte || [], box = $("#albero"); if (!box) return;
  const righe = [];
  const giu = (parent, liv) => tutte.filter(c => (c.parent_id || null) === parent).forEach(c => {
    const figli = tutte.some(x => x.parent_id === c.id);
    righe.push(`<div class="nodo" data-n="${c.id}" draggable="true" style="padding-left:${10 + liv * 22}px"><span class="fr" data-fr="${c.id}">${figli ? (S.aperte.has(c.id) ? "▾" : "▸") : ""}</span>${svg(IC.cartella)}<span>${esc(c.nome)}</span><small>${c.totale}</small></div>`);
    if (figli && S.aperte.has(c.id)) giu(c.id, liv + 1);
  });
  giu(null, 0);
  box.innerHTML = righe.join("") || `<p class="note" style="padding:8px 10px">Nessuna cartella: creane una con «+ Nuova cartella» (es. Casa, Auto, Lavoro).</p>`;
  $$(".nodo", box).forEach(el => {
    const id = +el.dataset.n;
    el.onclick = e => {
      if (e.target.dataset.fr) { S.aperte.has(id) ? S.aperte.delete(id) : S.aperte.add(id); return disegnaAlbero(); }
      go("cartella:" + id);
    };
    el.ondragstart = e => { S.trascinaRaccolta = { tipo: "cartella", id }; e.dataTransfer.setData("text/x-arca-cartella", String(id)); };
    el.ondragend = () => setTimeout(() => S.trascinaRaccolta = null, 50);
    el.ondragover = e => { if ((S.trascina && S.trascina.docs) || (S.trascinaRaccolta?.tipo === "cartella" && S.trascinaRaccolta.id !== id)) { e.preventDefault(); el.classList.add("over"); } };
    el.ondragleave = () => el.classList.remove("over");
    el.ondrop = async e => {
      e.preventDefault(); el.classList.remove("over");
      if (S.trascinaRaccolta?.tipo === "cartella") return spostaRaccolta(S.trascinaRaccolta, id);
      const tr = S.trascina; $("#dock").hidden = true; S.trascina = null;
      if (tr) { fatto((await spostaInCartella({ id }, tr.ids)).op); caricaFiltri(); renderDocumenti(); }
    };
  });
}

async function renderPulizia() {
  $("#view").innerHTML = `<div class="vhead"><div><h1>Pulizia</h1></div><span class="sub">Arca segnala, tu decidi. Niente viene eliminato senza conferma.</span></div><div id="pul"><p class="note">Controllo le foto…</p></div>`;
  const [p, dop] = await Promise.all([get("/api/pulizia"), get("/api/doppioni")]);
  if (!["pulizia", "doppioni"].includes(S.view)) return;
  const via = new Set();
  p.raffiche.forEach(g => g.slice(1).forEach(x => via.add(x.id)));
  dop.esatti.forEach(x => via.add(x.id));
  const item = (x, tenere) => `<div class="pitem ${via.has(x.id) ? "via" : ""}" data-p="${x.id}" title="Clic: segna o togli il segno · doppio clic: apri">
      <div class="th"><img src="${MINI(x.id)}" alt="" loading="lazy"></div><span class="tag">${via.has(x.id) ? "Elimina" : tenere ? "Da tenere" : ""}</span>
      <small>${esc(x.titolo || x.nome)}</small></div>`;
  const sez = (titolo, sotto, corpo, n) => n ? `<div class="box"><h2>${titolo} <span style="color:var(--ink3);font-weight:500">· ${n}</span></h2><p class="d">${sotto}</p>${corpo}</div>` : "";
  const tutti = [...dop.esatti, ...dop.simili.flat(), ...p.sfocate, ...p.luce, ...p.raffiche.flat()];
  $("#pul").innerHTML = (sez("Raffiche di scatti", "Foto fatte una dietro l'altra, quasi uguali. Arca tiene la più nitida e segna le altre: tocca per cambiare.",
      p.raffiche.map(g => `<div class="puli-gruppo">${g.map((x, k) => item(x, k === 0)).join("")}</div>`).join(""), p.raffiche.length)
    + sez("Foto sfocate o mosse", "Tocca quelle da eliminare. Quelle che ti piacciono così, segnale come buone e non te le mostro più.",
      `<div class="pgrid2">${p.sfocate.map(x => item(x)).join("")}</div>`, p.sfocate.length)
    + sez("Troppo scure o bruciate", "Foto quasi nere o quasi bianche: spesso scatti partiti per sbaglio.",
      `<div class="pgrid2">${p.luce.map(x => item(x)).join("")}</div>`, p.luce.length)
    + sez("Copie identiche", "File uguali, bit per bit, a qualcosa che è già in archivio. Sono già segnati.",
      `<div class="pgrid2">${dop.esatti.map(x => item(x)).join("")}</div>`, dop.esatti.length)
    + sez("Foto quasi uguali", "La stessa foto in dimensioni diverse. La prima è quella con più risoluzione.",
      dop.simili.map(g => `<div class="puli-gruppo">${g.map((x, k) => item(x, k === 0)).join("")}</div>`).join(""), dop.simili.length))
    || `<div class="vuoto"><b>Tutto pulito</b>Nessuna foto sfocata, doppia o venuta male da rivedere.</div>`;
  if (tutti.length) $("#pul").insertAdjacentHTML("beforeend", `<div class="salvabar" style="bottom:0"><div class="selbar" style="position:static;transform:none">
      <span id="pul-n"></span><button id="pul-del" class="danger">Elimina le segnate</button><button id="pul-ok">Le altre vanno bene</button></div></div>`);
  const agg = () => { if ($("#pul-n")) { $("#pul-n").textContent = plur(via.size, "foto segnata", "foto segnate"); $("#pul-del").disabled = !via.size; } };
  agg();
  $$("[data-p]").forEach(el => {
    const id = +el.dataset.p;
    el.onclick = () => {
      via.has(id) ? via.delete(id) : via.add(id);

      agg();

  });
  if ($("#pul-del")) {
    $("#pul-del").onclick = async () => {
      if (!await conferma(`Eliminare ${plur(via.size, "foto", "foto")}?`, "Puoi annullare subito dopo. Alla prossima apertura di Arca finiranno nel Cestino di Windows.")) return;
      fatto((await post("/api/elimina", { ids: [...via] })).op); caricaFiltri(); renderPulizia();
    };
    $("#pul-ok").onclick = async () => {
      const buone = [...p.sfocate, ...p.luce].map(x => x.id).filter(id => !via.has(id));

  });
  // la mappa
  const m = S.mappa = L.map("mappa-c", { zoomControl: true, worldCopyJump: true }).setView([42.5, 12.5], 5);
  let errori = 0;
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" })
    .on("tileerror", () => { if (++errori === 3) { const a = $("#mappa-avviso"); if (a) { a.hidden = false; a.textContent = "Lo sfondo della mappa serve internet: senza connessione vedi solo i punti delle foto. I luoghi a destra funzionano sempre."; } } })
    .addTo(m);
  const strato = L.layerGroup().addTo(m);
  const disegna = () => {
    strato.clearLayers();
    const b = m.getBounds().pad(0.3), celle = new Map();
    for (const [id, lat, lon] of punti) {
      if (!b.contains([lat, lon])) continue;
      const pt = m.latLngToLayerPoint([lat, lon]);
      const k = Math.floor(pt.x / 72) + ":" + Math.floor(pt.y / 72);
      if (!celle.has(k)) celle.set(k, []);
      celle.get(k).push([id, lat, lon]);
    }
    for (const g of celle.values()) {
      const lat = g.reduce((a, x) => a + x[1], 0) / g.length, lon = g.reduce((a, x) => a + x[2], 0) / g.length;
      const ic = L.divIcon({ className: "", iconSize: [54, 54], iconAnchor: [27, 27],
        html: `<div class="mk"><img src="${MINI(g[0][0])}" alt="">${g.length > 1 ? `<b>${g.length}</b>` : ""}</div>` });
      L.marker([lat, lon], { icon: ic }).addTo(strato).on("click", async () => {
        if (g.length === 1) { S.items = (await get("/api/items?ids=" + g[0][0])).items; S.totale = 1; return apriDettaglio(0); }
        if (m.getZoom() < 16) return m.fitBounds(L.latLngBounds(g.map(x => [x[1], x[2]])).pad(0.4), { maxZoom: 17 });
        go("libreria", { ids: g.map(x => x[0]).join(","), etichetta: "⌖ Foto in questo punto" });
      });
    }
  };
  m.on("moveend zoomend", disegna);
  if (S.filtro.centra) m.setView(S.filtro.centra, 14);
  else if (punti.length) m.fitBounds(L.latLngBounds(punti.map(x => [x[1], x[2]])).pad(0.15), { maxZoom: 12 });
  if (!punti.length) { const a = $("#mappa-avviso"); a.hidden = false; a.textContent = "Nessuna foto con la posizione per ora. Quelle fatte col telefono di solito ce l'hanno: compariranno qui."; }
  setTimeout(() => { m.invalidateSize(); disegna(); }, 50);
}

/* =================== riepilogo =================== */
async function renderRiepilogo() {
  const r = await get("/api/riepilogo");
  const tipo = t => r.per_tipo.find(x => x.tipo === t) || { n: 0, b: 0 };
  const docs = r.per_tipo.filter(x => !["Foto", "Video"].includes(x.tipo)).reduce((a, x) => ({ n: a.n + x.n, b: a.b + x.b }), { n: 0, b: 0 });
  const maxAnno = Math.max(1, ...r.per_anno.map(x => x.n));
  const giorni = r.backup_ultimo ? Math.floor((Date.now() - new Date(r.backup_ultimo.replace(" ", "T"))) / 864e5) : null;
  const daFare = [
    [MODO === "foto" ? r.senza_album : 0, "foto e video senza album", () => go("libreria", { in_album: "no" })],
    [MODO === "documenti" ? r.da_archiviare : 0, "documenti da archiviare", () => go("inbox")],
    [MODO === "foto" ? r.persone_senza_nome : 0, "persone senza nome", () => go("persone")],
    [r.da_analizzare, "file in attesa dell'AI", () => go("attivita")],
    [r.doppioni.n, `copie identiche (${pesoIt(r.doppioni.b)} recuperabili)`, () => go(MODO === "foto" ? "doppioni" : "documenti")],
  ];
  const disco = r.disco ? Math.round((1 - r.disco.libero / r.disco.totale) * 100) : null;
  $("#view").innerHTML = `<div class="vhead"><h1>Riepilogo</h1></div>
    <div class="box"><div class="stat">
      <div><b>${r.totale.n}</b><span>file in archivio · ${pesoIt(r.totale.b)}</span></div>
      ${MODO === "foto" ? `<div><b>${tipo("Foto").n}</b><span>foto · ${pesoIt(tipo("Foto").b)}</span></div>
      <div><b>${tipo("Video").n}</b><span>video · ${pesoIt(tipo("Video").b)}</span></div>
      <div><b>${r.album}</b><span>album</span></div>
      <div><b>${r.paesi}</b><span>${r.paesi === 1 ? "paese" : "paesi"} sulla mappa</span></div>`
      : `<div><b>${docs.n}</b><span>documenti · ${pesoIt(docs.b)}</span></div>
      <div><b>${r.cartelle}</b><span>cartelle</span></div>
      <div><b>${r.da_archiviare || 0}</b><span>da archiviare</span></div>`}</div>
      ${r.disco ? `<div class="disco"><div class="dbar"><i style="width:${disco}%"></i></div><span>Disco dell'archivio: liberi <b>${pesoIt(r.disco.libero)}</b> su ${pesoIt(r.disco.totale)}</span></div>` : ""}
    </div>
    <div class="riep2">
      <div class="box"><h2>Da sistemare</h2>
        ${daFare.filter(x => x[0]).map((x, k) => `<div class="todo" data-k="${daFare.indexOf(x)}"><b>${x[0]}</b><span>${x[1]}</span><i>›</i></div>`).join("") || `<p class="note">Tutto in ordine. 🎉</p>`}
      </div>
      <div class="box"><h2>Copia di sicurezza</h2>
        <p class="d">Copia tutto l'archivio ${MODO === "foto" ? "(e album, persone)" : "(e cartelle)"} su un altro disco. Copia solo quello che è cambiato, e non cancella mai niente nella copia: ciò che non c'è più finisce in «_Rimossi dal backup».</p>
        <div class="row"><input type="text" id="bk-dest" value="${esc(r.backup_dest)}" placeholder="es. E:\\ (disco esterno)"><button id="bk-sfoglia">Sfoglia…</button></div>
        <p class="bkstato ${giorni === null || giorni > 30 ? "warn" : "ok"}">${r.backup_ultimo ? `Ultima copia: <b>${dataIt(r.backup_ultimo, true)}</b>${giorni > 30 ? ` · sono passati ${giorni} giorni` : ""}` : "Non hai ancora fatto nessuna copia."}
          ${r.backup_dest && !r.backup_disco_presente ? "<br>Il disco della copia non è collegato." : ""}</p>
        <div class="acts"><button class="primary" id="bk-via" ${S.stato.operazione ? "disabled" : ""}>Fai la copia adesso</button></div>
      </div>
    </div>
    <div class="box"><h2>File per anno</h2>
      ${r.per_anno.map(x => `<div class="anno" data-anno="${x.anno}"><span>${x.anno || "—"}</span><div class="abar"><i style="width:${Math.max(1, x.n / maxAnno * 100)}%"></i></div><b>${x.n}</b><small>${pesoIt(x.b)}</small></div>`).join("") || `<p class="note">Ancora nessun file.</p>`}
    </div>`;
  $$(".todo").forEach(el => el.onclick = () => daFare[+el.dataset.k][2]());
  $$(".anno").forEach(el => el.onclick = () => go("libreria", { anno: el.dataset.anno }));
  const salvaDest = async () => { S.cfg = await post("/api/impostazioni", { backup_dest: $("#bk-dest").value.trim() }); };
  $("#bk-sfoglia").onclick = async () => { const p = await scegliCartella(); if (p) { $("#bk-dest").value = p; await salvaDest(); renderRiepilogo(); } };
  $("#bk-dest").onchange = salvaDest;
  $("#bk-via").onclick = async () => {
    if (!$("#bk-dest").value.trim()) return toast("Scegli prima dove fare la copia (per esempio un disco esterno)");
    await salvaDest();
    const x = await post("/api/backup");
    toast(x.avviato ? "Copia di sicurezza avviata: puoi continuare a usare Arca, ti avviso quando ha finito" : "C'è già un'operazione in corso, aspetta che finisca", 5000);
    $("#bk-via").disabled = true;
  };
}

  $("#view").innerHTML = `<div class="vhead"><h1>Attività</h1></div>
    <div class="box"><div class="stat">
      <div><b id="att-coda">${st.coda}</b><span>file in coda</span></div>
      <div><b id="att-fatti">${st.fatti}</b><span>sistemati da quando hai aperto Arca</span></div>

      <div class="acts"><button id="att-pausa">${st.in_pausa ? "▶ Riprendi" : "⏸ Metti in pausa"}</button></div>
    </div>
    <div class="box"><h2>Intelligenza artificiale</h2>
      <p class="d">${st.ai.attivo ? (st.ai.visione ? `Pronta. Modello in uso: <b>${esc(S.cfg.modello_visione)}</b>${st.ai.ricerca ? "" : " (manca il modello per la ricerca a parole: riesegui Installa.bat)"}.` : `Ollama è attivo ma il modello <b>${esc(S.cfg.modello_visione)}</b> non è installato. Riesegui <b>Installa.bat</b>.`) : "Ollama non risponde. Avvialo dal menu Start (o riavvia il PC): nel frattempo i file vengono sistemati solo per data, con la categoria «Da classificare»."}</p>
      ${st.da_analizzare ? `<div class="acts"><button class="primary" id="att-rian">Analizza ora i ${st.da_analizzare} file in attesa</button><button id="att-vedi">Mostrali</button></div>` : ""}
    </div>
    <div class="box"><h2>Manutenzione</h2>
      <p class="d"><b>Controlla archivio</b> toglie dall'elenco i file che hai cancellato o spostato a mano, e prende in carico quelli che hai messo direttamente nella cartella dell'archivio. Le cartelle che trova dentro <b>Album</b> diventano album con lo stesso nome; quelle dentro <b>Documenti</b> diventano cartelline. I file restano dove sono.</p>

    ${st.errori.length ? `<div class="box"><h2>Problemi recenti</h2>${st.errori.map(e => `<div class="err"><b>${esc(e.file)}</b> · ${esc(e.quando)}<br>${esc(e.errore)}</div>`).join("")}
      <p class="note">Questi file sono rimasti dov'erano: puoi riprovare trascinandoli di nuovo in Arca.</p></div>` : ""}`;

  if ($("#att-rian")) $("#att-rian").onclick = async () => { const r = await post("/api/rianalizza"); toast(`${plur(r.accodati, "file", "file")} in coda`); };
  if ($("#att-vedi")) $("#att-vedi").onclick = () => go("libreria", { da_analizzare: true });
  $("#att-scan").onclick = async () => { const r = await post("/api/scansiona"); toast(r.avviato ? "Controllo avviato: puoi continuare a usare Arca, ti avviso quando ha finito" : "C'è già un'operazione in corso, aspetta che finisca"); };

/* =================== finestre e scelte native =================== */
const nativo = () => window.pywebview && window.pywebview.api;
async function scegliCartella() {
  if (nativo()) return await window.pywebview.api.scegli_cartella();
  return await chiedi("Percorso della cartella", "Incolla il percorso (es. D:\\Archivio)", "");
}
async function importa(modo) {
  let percorsi = [];
  if (nativo()) percorsi = modo === "file" ? await window.pywebview.api.scegli_file() : [await window.pywebview.api.scegli_cartella()];
  else { const p = await chiedi("Aggiungi", "Percorso di un file o di una cartella", ""); if (p) percorsi = [p]; }
  percorsi = (percorsi || []).filter(Boolean);
  if (!percorsi.length) return;
  if (modo === "cartella" && !await conferma("Spostare tutta la cartella in Arca?", `Tutti i file dentro «${percorsi[0]}» (anche nelle sottocartelle) verranno analizzati e spostati nell'archivio.`)) return;
  try { const r = await post("/api/importa", { percorsi }); toast(`${plur(r.accodati, "file", "file")} in arrivo: li sistemo uno alla volta`); aggiornaStato(); }
  catch (e) { toast(e.message); }
}
window.arcaImportati = n => { toast(`${plur(n, "file", "file")} in arrivo: li sistemo uno alla volta`); aggiornaStato(); };

function modale(html, classe = "") { const m = $("#modal"); m.innerHTML = `<div class="win ${classe}">${html}</div>`; m.hidden = false; }
function chiudiModale() { $("#modal").hidden = true; $("#modal").innerHTML = ""; }
function chiedi(titolo, etichetta, valore) {
  return new Promise(res => {
    modale(`<h2>${esc(titolo)}</h2><input type="text" id="m-v" placeholder="${esc(etichetta)}" value="${esc(valore)}">
      <div class="foot"><button id="m-no">Annulla</button><button class="primary" id="m-si">OK</button></div>`);
    const v = $("#m-v"); v.focus(); v.select();
    const fine = x => { chiudiModale(); res(x); };
    $("#m-si").onclick = () => fine(v.value.trim()); $("#m-no").onclick = () => fine(null);
    v.onkeydown = e => { if (e.key === "Enter") fine(v.value.trim()); if (e.key === "Escape") fine(null); };
  });
}
function conferma(titolo, testo) {
  return new Promise(res => {
    modale(`<h2>${esc(titolo)}</h2><p style="color:var(--ink2);line-height:1.45">${esc(testo)}</p>
      <div class="foot"><button id="m-no">Annulla</button><button class="primary" id="m-si">Conferma</button></div>`);
    $("#m-si").onclick = () => { chiudiModale(); res(true); }; $("#m-no").onclick = () => { chiudiModale(); res(false); };
  });
}

/* =================== eventi globali =================== */
function bindGlobali() {
  $$("#nav a").forEach(a => a.onclick = () => go(a.dataset.v));
  let t;
  $("#q").oninput = e => {
    clearTimeout(t);
    t = setTimeout(() => { const v = e.target.value.trim(); if (v) cerca(v); else if (S.view === "ricerca") go("perte"); }, 500);
  };
  $("#btn-importa").onclick = e => { e.stopPropagation(); $("#menu-importa").classList.toggle("open"); };
  $$("#menu-importa [data-imp]").forEach(b => b.onclick = () => { $("#menu-importa").classList.remove("open"); importa(b.dataset.imp); });
  document.addEventListener("click", () => $$(".menu.open").forEach(m => m.classList.remove("open")));
  $("#statocard").onclick = () => go("attivita");
  $("#btn-annulla").onclick = annulla;
  $$("#selbar [data-sel]").forEach(b => b.onclick = () => azioneSel(b.dataset.sel));
  document.addEventListener("keydown", e => {
    if (!$("#modal").hidden) { if (e.key === "Escape") chiudiModale(); return; }
    if (S.detailIdx >= 0) {
      if (["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
      if (e.key === "Escape") chiudiDettaglio();
      if (e.key === "ArrowLeft" && S.detailIdx > 0) apriDettaglio(S.detailIdx - 1);
      if (e.key === "ArrowRight" && S.detailIdx < S.items.length - 1) apriDettaglio(S.detailIdx + 1);
      return;
    }
    if (e.key === "Escape" && S.sel.size) { S.sel.clear(); aggiornaSelbar(); }
    if ((e.ctrlKey || e.metaKey) && e.key === "a" && isGriglia() && document.activeElement.tagName !== "INPUT") {
      e.preventDefault(); S.items.forEach(x => S.sel.add(x.id)); $$(".card").forEach(c => c.classList.add("sel")); aggiornaSelbar();
    }
    if ((e.ctrlKey || e.metaKey) && ["f", "k"].includes(e.key.toLowerCase())) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) { e.preventDefault(); annulla(); }
  });
  // trascinamento: il percorso dei file lo riceve Arca lato PC (pywebview)
  let cnt = 0;
  window.addEventListener("dragenter", e => { if (!S.trascina && e.dataTransfer?.types?.includes("Files")) { cnt++; $("#drop").hidden = false; } });
  window.addEventListener("dragleave", () => { if (--cnt <= 0) { cnt = 0; $("#drop").hidden = true; } });
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => { e.preventDefault(); cnt = 0; $("#drop").hidden = true; if (!S.trascina && !nativo()) toast("Trascinare funziona nella finestra di Arca: qui usa «＋ Aggiungi»."); });
}

<script>/* Regia della demo: un cursore finto che si muove e clicca come farebbe una persona. Usata dalle scene del sito. */
(function () {
  const T = window.__T = { token: 0, slow: 1, on: false };
  const css = document.createElement("style");
  css.textContent = `#tcur{position:fixed;left:-40px;top:-40px;width:26px;height:26px;z-index:99999;pointer-events:none;transition:left var(--tm,.9s) cubic-bezier(.4,.1,.2,1),top var(--tm,.9s) cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  #tcur svg{width:26px;height:26px;transition:transform .15s}#tcur.dn svg{transform:scale(.82)}
  #tcur i{position:absolute;left:-9px;top:-9px;width:28px;height:28px;border-radius:50%;background:rgba(10,132,255,.35);opacity:0;transform:scale(.3)}
  #tcur.dn i{opacity:1;transform:scale(1);transition:all .25s}
  .tfocus{outline:3px solid rgba(10,132,255,.55)!important;outline-offset:2px;transition:outline .2s}`;
  document.head.appendChild(css);
  const cur = document.createElement("div"); cur.id = "tcur";
  cur.innerHTML = '<i></i><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  document.body.appendChild(cur);
  const sleep = ms => new Promise(r => setTimeout(r, ms * T.slow));
  const alive = tk => { if (tk !== T.token) throw "stop"; };
  const q = s => typeof s === "string" ? document.querySelector(s) : typeof s === "function" ? s() : s;
  T.by = (css, text) => () => [...document.querySelectorAll(css)].find(e => (e.innerText || e.textContent || "").trim().toLowerCase().includes(text.toLowerCase()));
  async function waitFor(sel, tk, max = 4000) { const t0 = Date.now(); let e; while (!(e = q(sel))) { alive(tk); if (Date.now() - t0 > max) return null; await new Promise(r => setTimeout(r, 60)); } return e; }
  function ctx(tk) {
    return {
      wait: async ms => { alive(tk); await sleep(ms); alive(tk); },
      async move(sel, dx = 0, dy = 0, ms = 900) {
        const e = await waitFor(sel, tk); if (!e) return null; alive(tk);
        const r = e.getBoundingClientRect(); cur.style.setProperty("--tm", (ms * T.slow / 1000) + "s");
        cur.style.left = (r.left + r.width / 2 + dx) + "px"; cur.style.top = (r.top + r.height / 2 + dy) + "px"; await sleep(ms + 80); alive(tk); return e;
      },
      async click(sel, opt = {}) {
        const e = await this.move(sel, opt.dx || 0, opt.dy || 0, opt.ms || 900); if (!e) return;
        cur.classList.add("dn"); await sleep(170); alive(tk);
        e.dispatchEvent(new MouseEvent("mousedown", { bubbles: true })); e.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
        e.click(); cur.classList.remove("dn"); await sleep(opt.after || 450); alive(tk);
      },
      async type(sel, text, cps = 9) {
        const e = await this.click(sel, { after: 150 }) || q(sel); const el = q(sel); if (!el) return; el.focus(); el.value = "";
        for (const ch of text) { alive(tk); el.value += ch; el.dispatchEvent(new Event("input", { bubbles: true })); await sleep(1000 / cps); }
      },
      key: async (sel, key) => { const el = q(sel); el && el.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true })); await sleep(300); alive(tk); },
      async scroll(sel, y, ms = 900) { const e = q(sel); if (!e) return; e.scrollTo({ top: y, behavior: "smooth" }); await sleep(ms); alive(tk); },
      park() { cur.style.setProperty("--tm", ".8s"); cur.style.left = "-60px"; cur.style.top = "-60px"; },
      go: async v => { await this.click('#nav a[data-v="' + v + '"]'); },
    };
  }
  /* Esegue una scena; ogni nuova scena interrompe la precedente. */
  T.scene = async fn => {
    const tk = ++T.token; const c = ctx(tk); c.go = async v => c.click('#nav a[data-v="' + v + '"]');
    try { await fn(c); } catch (e) { if (e !== "stop") console.error(e); }
  };
  T.stop = () => { T.token++; };
  T.reset = () => { T.token++; window.__arcaDemo && window.__arcaDemo.reset && window.__arcaDemo.reset(); document.querySelectorAll("#modal,#detail").forEach(x => { x.hidden = true; }); const m = document.getElementById("modal"); if (m) m.innerHTML = ""; cur.style.left = "-60px"; cur.style.top = "-60px"; };
})();
</script>
<script>/* Scene delle pagine di Arca: ogni capitolo fa muovere il cursore dentro il programma vero. */
(function () {
  const by = (c, t) => window.__T.by(c, t);
  const F = [
    /* 0 · Per te */
    async s => { await s.go("perte"); await s.wait(1400); await s.scroll("#view", 260, 1200); await s.wait(900); await s.scroll("#view", 0, 900); await s.click('.ricordo[data-r="0"]', { after: 1800 }); await s.go("perte"); },
    /* 1 · Libreria: aggiungi */
    async s => { await s.go("libreria"); await s.wait(1200); await s.click("#btn-importa"); await s.wait(700); await s.click('#menu-importa [data-imp="file"]', { after: 2600 }); await s.wait(1800); },
    /* 2 · Cerca e condividi */
    async s => {
      await s.go("libreria"); await s.wait(700); await s.type("#q", "tramonto sardegna", 8); await s.key("#q", "Enter"); await s.wait(1800);

      for (const sel of [".card.foto:nth-child(1)", ".card.foto:nth-child(2)", ".card.foto:nth-child(3)"]) await s.click(sel, { ms: 600, after: 350 });

    },

  ];
  const D = [
    /* 0 · Per te: ha notato */
    async s => { await s.go("perte"); await s.wait(1500); await s.scroll("#view", 300, 1300); await s.wait(1200); await s.scroll("#view", 0, 900); },
    /* 1 · Chiedi ad Arca */
    async s => { await s.go("perte"); await s.wait(900); await s.type("#ask", "Quanto ho speso di luce nel 2025?", 11); await s.key("#ask", "Enter"); await s.wait(2600); },
    /* 2 · Cartelle */
    async s => { await s.go("documenti"); await s.wait(1300); await s.click(by("#view .r, #view [data-c], #view [data-par]", "Bollette"), { after: 900 }); await s.wait(1400); },
    /* 3 · Da archiviare */
    async s => { await s.go("inbox"); await s.wait(1600); },
    /* 4 · Scadenze */
    async s => { await s.go("scadenze"); await s.wait(1500); await s.scroll("#view", 220, 1200); await s.wait(1200); await s.scroll("#view", 0, 800); },
    /* 5 · Riepilogo */
    async s => { await s.go("riepilogo"); await s.wait(2500); },
    /* 6 · Impostazioni */
    async s => { await s.go("impostazioni"); await s.wait(1400); await s.scroll("#view", 420, 1400); await s.wait(1500); },
  ];
  window.ARCA_SCENES = { foto: F, documenti: D };
